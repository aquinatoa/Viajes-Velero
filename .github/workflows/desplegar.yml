name: Desplegar

# Solo lo que ya esta en main. Los PR se prueban (pruebas.yml) pero no
# despliegan: una rama a medias no debe sustituir lo que el cliente usa.
on:
  push:
    branches: [main]
  # Y a mano, para volver a desplegar sin empujar un commit vacio.
  workflow_dispatch:

# Un despliegue a la vez: dos a la par se pisarian el symlink `current`.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  # Las pruebas se repiten aqui aunque ya pasaran en el PR. No es redundancia
  # inutil: lo que se despliega es el resultado de la fusion, que no es
  # exactamente lo que se probo en la rama.
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oravia
          POSTGRES_PASSWORD: oravia
          POSTGRES_DB: oravia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://oravia:oravia@localhost:5432/oravia
      TEST_DATABASE_URL: postgresql://oravia:oravia@localhost:5432/oravia

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm test

  desplegar:
    needs: pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar SSH
        # La huella del servidor evita aceptar a ciegas un host desconocido, que
        # es lo que deja la puerta abierta a un intermediario.
        #
        # La clave se acepta como venga: base64 de una linea, base64 partido por
        # el terminal, texto en crudo, o texto cuyos saltos se perdieron al
        # copiar. Cada una de esas formas ha costado un despliegue fallido, y el
        # valor no se puede inspeccionar a mano porque es un secret: lo unico
        # sensato es admitirlas todas y decir cual se uso.
        run: |
          mkdir -p ~/.ssh
          clave=~/.ssh/id_ed25519
          secreto="${{ secrets.SSH_CLAVE_PRIVADA }}"

          escribir_y_validar() {
            # El salto final importa: una clave OpenSSH sin el no vale, y la
            # sustitucion de comandos de bash se lo come sin avisar.
            printf '%s\n' "$1" > "$clave"
            chmod 600 "$clave"
            ssh-keygen -y -f "$clave" > /dev/null 2>&1
          }

          modo=""
          compacto="$(printf '%s' "$secreto" | tr -d '[:space:]')"
          if descifrado="$(printf '%s' "$compacto" | base64 -d 2>/dev/null)" \
             && escribir_y_validar "$descifrado"; then
            modo="base64"
          elif escribir_y_validar "$secreto"; then
            modo="texto en crudo"
          else
            cuerpo="$(printf '%s' "$secreto" \
              | sed -e 's/.*BEGIN OPENSSH PRIVATE KEY-----//' \
                    -e 's/-----END OPENSSH PRIVATE KEY.*//' \
              | tr -d '[:space:]')"
            if [ -n "$cuerpo" ] && escribir_y_validar "-----BEGIN OPENSSH PRIVATE KEY-----
          $(printf '%s' "$cuerpo" | fold -w 70)
          -----END OPENSSH PRIVATE KEY-----"; then
              modo="texto replegado"
            fi
          fi

          if [ -z "$modo" ]; then
            # Que forma tiene lo recibido, sin exponerlo: es lo unico que
            # permite saber si se pego la clave publica, un valor truncado o
            # nada en absoluto.
            tiene_begin=no; case "$secreto" in *BEGIN*) tiene_begin=si;; esac
            tiene_publica=no; case "$secreto" in ssh-ed25519*|ssh-rsa*) tiene_publica=si;; esac
            echo "::error::SSH_CLAVE_PRIVADA no sirve en ninguna de sus formas."
            echo "::error::Recibido: $(printf '%s' "$secreto" | wc -c) caracteres, \
          $(printf '%s' "$secreto" | wc -l) saltos de linea, marcador BEGIN: $tiene_begin, \
          parece clave publica: $tiene_publica"
            echo "::error::Una clave ed25519 son ~400 caracteres en base64, o ~460 en crudo."
            echo "::error::Regenerala con: sudo base64 -w0 /home/deploy/.ssh/github_actions"
            exit 1
          fi
          echo "Clave cargada ($modo): $(ssh-keygen -lf "$clave" | awk '{print $2}')"

          printf '%s\n' "${{ secrets.SSH_HUELLA_SERVIDOR }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          if ! grep -q 'ssh-' ~/.ssh/known_hosts; then
            echo "::error::SSH_HUELLA_SERVIDOR no contiene ninguna clave de host. Regenerala con:"
            echo "::error::  ssh-keyscan -H <ip-del-servidor> | grep -v '^#'"
            exit 1
          fi

      - name: Desplegar
        # El script viaja por la tuberia desde ESTE commit, no desde una copia
        # que envejece en el servidor: se despliega con la version del script que
        # corresponde al codigo que se despliega.
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              "${{ secrets.SSH_USUARIO }}@${{ secrets.SSH_SERVIDOR }}" \
              'bash -s' -- "${{ github.sha }}" < scripts/desplegar.sh

      - name: Limpiar la clave
        if: always()
        run: rm -f ~/.ssh/id_ed25519
